{% extends 'academic/base_generic.html' %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card">
      <div class="card-header">Sign in</div>
      <div class="card-body">
        {% if form.non_field_errors %}
          <div class="alert alert-danger">{{ form.non_field_errors }}</div>
        {% endif %}
        <form method="post" novalidate>
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label" for="{{ form.username.id_for_label }}">Username</label>
            <input type="text" name="username" id="{{ form.username.id_for_label }}"
                   class="form-control" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label" for="{{ form.password.id_for_label }}">Password</label>
            <input type="password" name="password" id="{{ form.password.id_for_label }}"
                   class="form-control" required>
          </div>
          <button class="btn btn-primary w-100" type="submit">Sign in</button>
        </form>
      </div>
      <div class="card-footer bg-white text-center">
        No account? <a href="{% url 'register' %}">Register</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
