{% extends 'academic/base_generic.html' %}
{% block title %}Create a new course{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="card">
      <div class="card-header">Create a new course</div>
      <div class="card-body">
        <form method="post" enctype="multipart/form-data" novalidate>
          {% csrf_token %}
          {% include 'academic/_form_fields.html' %}
          <button class="btn btn-primary" type="submit">Create course</button>
          <a class="btn btn-link" href="{% url 'manage_courses' %}">Cancel</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
